<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="赛博拼豆 — 在线拼豆图纸设计工具：照片一键转拼豆图、真实色号匹配、自动生成颜色用量购物清单。">
<meta name="theme-color" content="#12141A">
<meta property="og:title" content="赛博拼豆 · Cyber Perler">
<meta property="og:description" content="照片转拼豆图纸，自动算颜色用量。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141A'/%3E%3Ccircle cx='11' cy='11' r='5' fill='%23F2B33D'/%3E%3Ccircle cx='11' cy='11' r='1.8' fill='%2312141A'/%3E%3Ccircle cx='21' cy='11' r='5' fill='%235DD6B0'/%3E%3Ccircle cx='21' cy='11' r='1.8' fill='%2312141A'/%3E%3Ccircle cx='11' cy='21' r='5' fill='%235DD6B0'/%3E%3Ccircle cx='11' cy='21' r='1.8' fill='%2312141A'/%3E%3Ccircle cx='21' cy='21' r='5' fill='%23F2B33D'/%3E%3Ccircle cx='21' cy='21' r='1.8' fill='%2312141A'/%3E%3C/svg%3E">
<title>赛博拼豆 · Cyber Perler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141A; --panel:#1A1D26; --panel-2:#232734;
    --line:rgba(255,255,255,0.09);
    --text:#EDEFF3; --muted:#8B93A5;
    --accent:#F2B33D; --accent-2:#5DD6B0; --danger:#E5716A;
    --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--body);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button,input,select{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  /* LAYOUT */
  .app{display:flex; flex-direction:column; height:100vh;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel);
    flex-shrink:0; gap:12px; flex-wrap:wrap;
  }
  .brand{font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:-0.01em;}
  .brand span{color:var(--accent);}
  .brand small{display:block; font-size:0.68rem; color:var(--muted); font-weight:400; letter-spacing:0.06em;}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .btn{
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    padding:8px 14px; border-radius:8px; font-size:0.84rem; font-weight:500;
    transition:background .15s, border-color .15s;
  }
  .btn:hover{background:#2C3140; border-color:rgba(255,255,255,0.2);}
  .btn.primary{background:var(--accent); color:#1A1206; border-color:var(--accent); font-weight:600;}
  .btn.primary:hover{background:#FFC456;}
  .btn.ghost-danger:hover{border-color:var(--danger); color:var(--danger);}
  .btn.sm{padding:6px 10px; font-size:0.78rem;}

  .main{display:flex; flex:1; min-height:0;}

  /* LEFT TOOLBAR */
  .tools{
    width:64px; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; padding:14px 0; gap:6px; flex-shrink:0;
  }
  .tool{
    width:44px; height:44px; border-radius:10px; background:transparent;
    border:1px solid transparent; color:var(--muted); font-size:1.15rem;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .tool:hover{background:var(--panel-2); color:var(--text);}
  .tool.active{background:var(--accent); color:#1A1206; border-color:var(--accent);}
  .tool-sep{width:32px; height:1px; background:var(--line); margin:8px 0;}

  /* CANVAS AREA */
  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    overflow:auto; padding:24px; position:relative; min-width:0;
  }
  .board-wrap{position:relative;}
  canvas#board{
    background:#0C0E13; border-radius:6px; cursor:crosshair;
    image-rendering:pixelated; display:block;
    box-shadow:0 18px 50px rgba(0,0,0,0.45);
  }
  .stage-hint{
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:0.74rem; color:var(--muted); font-family:var(--mono);
    background:rgba(18,20,26,0.9); padding:5px 12px; border-radius:999px;
    border:1px solid var(--line); white-space:nowrap;
  }

  /* RIGHT PANEL */
  .side{
    width:308px; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; flex-shrink:0;
  }
  .tabs{display:flex; border-bottom:1px solid var(--line); flex-shrink:0;}
  .tab{
    flex:1; background:none; border:none; color:var(--muted);
    padding:12px 4px; font-size:0.82rem; font-weight:500;
    border-bottom:2px solid transparent; transition:all .15s;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent); border-bottom-color:var(--accent);}
  .panel-body{flex:1; overflow-y:auto; padding:16px;}
  .panel-body::-webkit-scrollbar{width:8px;}
  .panel-body::-webkit-scrollbar-thumb{background:var(--panel-2); border-radius:4px;}

  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:0.72rem; color:var(--muted); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:0.08em; font-weight:600;
  }
  .field select, .field input[type=number], .field input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius:8px; font-size:0.86rem;
  }
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}

  .swatch-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:5px;}
  .swatch{
    aspect-ratio:1; border-radius:7px; border:2px solid transparent;
    position:relative; transition:transform .1s; padding:0;
  }
  .swatch:hover{transform:scale(1.12); z-index:2;}
  .swatch.active{border-color:var(--accent); transform:scale(1.12);}
  .swatch.active::after{
    content:''; position:absolute; inset:0; border-radius:5px;
    border:2px solid rgba(0,0,0,0.35);
  }

  .current-color{
    display:flex; align-items:center; gap:11px; padding:11px;
    background:var(--panel-2); border-radius:10px; margin-bottom:16px;
  }
  .current-chip{width:38px; height:38px; border-radius:8px; border:1px solid rgba(255,255,255,0.18); flex-shrink:0;}
  .current-meta{min-width:0;}
  .current-meta strong{display:block; font-size:0.88rem; margin-bottom:2px;}
  .current-meta span{font-size:0.72rem; color:var(--muted); font-family:var(--mono);}

  /* STATS */
  .stat-cards{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px;}
  .stat-card{background:var(--panel-2); border-radius:10px; padding:12px;}
  .stat-card .num{font-family:var(--mono); font-size:1.3rem; font-weight:500; color:var(--accent);}
  .stat-card .lbl{font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  table.counts{width:100%; border-collapse:collapse; font-size:0.82rem;}
  table.counts th{
    text-align:left; font-size:0.68rem; color:var(--muted); text-transform:uppercase;
    letter-spacing:0.06em; padding:6px 4px; border-bottom:1px solid var(--line);
  }
  table.counts td{padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.counts td.qty{text-align:right; font-family:var(--mono); color:var(--accent-2);}
  .mini-chip{
    width:16px; height:16px; border-radius:4px; display:inline-block;
    vertical-align:middle; margin-right:7px; border:1px solid rgba(255,255,255,0.16);
  }
  .empty-note{color:var(--muted); font-size:0.84rem; text-align:center; padding:28px 12px; line-height:1.6;}

  /* IMPORT */
  .drop-zone{
    border:2px dashed var(--line); border-radius:12px; padding:26px 16px;
    text-align:center; color:var(--muted); font-size:0.84rem; margin-bottom:16px;
    transition:border-color .15s, background .15s; cursor:pointer; line-height:1.6;
  }
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--accent); background:rgba(242,179,61,0.06); color:var(--text);}
  .preview-box{margin-bottom:16px; border-radius:10px; overflow:hidden; background:var(--panel-2);}
  .preview-box img{width:100%; display:block; max-height:170px; object-fit:contain;}

  .check-row{display:flex; align-items:center; gap:9px; margin-bottom:11px; font-size:0.84rem;}
  .check-row input{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
  .check-row label{cursor:pointer; color:var(--text);}
  .hint{font-size:0.73rem; color:var(--muted); line-height:1.55; margin:6px 0 0;}

  input[type=range]{width:100%; accent-color:var(--accent);}
  .range-val{font-family:var(--mono); font-size:0.78rem; color:var(--accent-2); float:right;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(80px);
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:11px 20px; border-radius:10px; font-size:0.86rem; z-index:100;
    transition:transform .28s ease; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0);}

  @media (max-width:900px){
    .side{width:250px;}
    .swatch-grid{grid-template-columns:repeat(5,1fr);}
  }
  @media (max-width:680px){
    .main{flex-direction:column;}
    .side{width:100%; height:44%; border-left:none; border-top:1px solid var(--line);}
    .tools{flex-direction:row; width:100%; height:58px; padding:0 10px; justify-content:center;}
    .tool-sep{width:1px; height:28px; margin:0 6px;}
    .stage{padding:12px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">赛博拼豆 <span>·</span> CYBER PERLER
      <small>PIXEL BEAD STUDIO</small>
    </div>
    <div class="header-actions">
      <button class="btn sm" id="langBtn" style="font-family:var(--mono);">EN</button>
      <button class="btn sm" id="undoBtn" data-i18n-title="undo_t" data-i18n="undo">↶ 撤销</button>
      <button class="btn sm" id="gridToggleBtn" data-i18n="grid">◫ 网格</button>
      <button class="btn sm" id="styleToggleBtn">● 豆子</button>
      <button class="btn sm" id="saveBtn" data-i18n="save">↓ 保存工程</button>
      <button class="btn sm" id="loadBtn" data-i18n="open">↑ 打开</button>
      <button class="btn sm primary" id="exportBtn" data-i18n="export">导出 PNG</button>
      <button class="btn sm ghost-danger" id="clearBtn" data-i18n="clear">清空</button>
    </div>
  </header>

  <div class="main">
    <!-- TOOLS -->
    <div class="tools">
      <button class="tool active" data-tool="pen" data-i18n-title="t_pen" title="画笔 (B)">✎</button>
      <button class="tool" data-tool="eraser" data-i18n-title="t_eraser" title="橡皮 (E)">⌫</button>
      <button class="tool" data-tool="fill" data-i18n-title="t_fill" title="油漆桶 (G)">◍</button>
      <button class="tool" data-tool="picker" data-i18n-title="t_picker" title="取色 (I)">◎</button>
      <div class="tool-sep"></div>
      <button class="tool" id="zoomIn" data-i18n-title="t_zin" title="放大">+</button>
      <button class="tool" id="zoomOut" data-i18n-title="t_zout" title="缩小">−</button>
    </div>

    <!-- CANVAS -->
    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="board"></canvas>
      </div>
      <div class="stage-hint" id="stageHint">拖动鼠标连续绘制 · 右键擦除</div>
    </div>

    <!-- SIDE PANEL -->
    <div class="side">
      <div class="tabs">
        <button class="tab active" data-tab="palette" data-i18n="tab_palette">调色板</button>
        <button class="tab" data-tab="import" data-i18n="tab_import">导入照片</button>
        <button class="tab" data-tab="stats" data-i18n="tab_stats">用量清单</button>
      </div>

      <!-- PALETTE TAB -->
      <div class="panel-body" id="tab-palette">
        <div class="current-color">
          <div class="current-chip" id="currentChip"></div>
          <div class="current-meta">
            <strong id="currentName">White</strong>
            <span id="currentHex">#FFFFFF</span>
          </div>
        </div>

        <div class="field">
          <label data-i18n="lbl_size">画板尺寸</label>
          <select id="sizeSelect">
            <option value="29">29 × 29（标准方形拼板）</option>
            <option value="14">14 × 14（小方板）</option>
            <option value="20">20 × 20</option>
            <option value="40">40 × 40</option>
            <option value="58" selected>58 × 58（四板拼接）· 照片推荐</option>
            <option value="87">87 × 87（九板拼接）</option>
          </select>
          <p class="hint" data-i18n="hint_size">改尺寸会重置画板。标准拼板是 29×29 钉。</p>
        </div>

        <div class="field">
          <label data-i18n="lbl_colors">色号库</label>
          <div class="swatch-grid" id="swatchGrid"></div>
          <p class="hint" id="paletteNote"></p>
        </div>
      </div>

      <!-- IMPORT TAB -->
      <div class="panel-body" id="tab-import" style="display:none;">
        <div class="drop-zone" id="dropZone">
          <span data-i18n="drop_1">点击选择图片</span><br><span data-i18n="drop_2">或把图片拖进来</span>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none;">

        <div id="previewWrap" style="display:none;">
          <div class="preview-box"><img id="previewImg" alt="预览"></div>
        </div>

        <div class="field">
          <label><span data-i18n="lbl_dither">抖动强度</span> <span class="range-val" id="ditherVal">关</span></label>
          <input type="range" id="ditherRange" min="0" max="100" value="0">
          <p class="hint" data-i18n="hint_dither"></p>
        </div>

        <div class="field">
          <label><span data-i18n="lbl_ncolors">可用颜色数</span> <span class="range-val" id="paletteVal">全部</span></label>
          <input type="range" id="paletteRange" min="4" max="58" value="58">
          <p class="hint" data-i18n="hint_ncolors">限制颜色数量能省钱（少买几种色），但细节会丢失。</p>
        </div>

        <div class="check-row">
          <input type="checkbox" id="removeBg" checked>
          <label for="removeBg" data-i18n="lbl_bg">去掉纯白/透明背景</label>
        </div>

        <button class="btn primary" id="convertBtn" style="width:100%;" disabled data-i18n="btn_convert">转换成拼豆图</button>
        <p class="hint" id="convertHint" data-i18n="hint_pickfirst">先选一张图片</p>
      </div>

      <!-- STATS TAB -->
      <div class="panel-body" id="tab-stats" style="display:none;">
        <div class="stat-cards">
          <div class="stat-card"><div class="num" id="statTotal">0</div><div class="lbl" data-i18n="st_total">豆子总数</div></div>
          <div class="stat-card"><div class="num" id="statColors">0</div><div class="lbl" data-i18n="st_colors">用到颜色</div></div>
          <div class="stat-card"><div class="num" id="statBoards">0</div><div class="lbl" data-i18n="st_boards">需要拼板</div></div>
          <div class="stat-card"><div class="num" id="statFill">0%</div><div class="lbl" data-i18n="st_fill">填充率</div></div>
        </div>

        <div id="countsWrap"></div>

        <button class="btn" id="copyListBtn" style="width:100%; margin-top:14px;" data-i18n="btn_copy">复制购物清单</button>
        <p class="hint" data-i18n="hint_copy"></p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================

   默认跟随浏览器语言，用户手动切换后记在内存里。

/* ---------- 颜色工具：RGB → LAB ----------
   为什么要转 LAB：RGB 空间里的"距离"和人眼看到的色差不成正比，
   直接在 RGB 里找最近颜色，深蓝可能被匹配成紫色。
   LAB 是感知均匀空间，欧氏距离才近似等于人眼感受到的色差。 */
function hexToRgb(hex){
  const v = parseInt(hex.slice(1),16);
  return [(v>>16)&255, (v>>8)&255, v&255];
}
function rgbToLab(r,g,b){
  // sRGB → 线性 RGB（去 gamma）
  let R=r/255, G=g/255, B=b/255;
  R = R>0.04045 ? Math.pow((R+0.055)/1.055,2.4) : R/12.92;
  G = G>0.04045 ? Math.pow((G+0.055)/1.055,2.4) : G/12.92;
  B = B>0.04045 ? Math.pow((B+0.055)/1.055,2.4) : B/12.92;
  // 线性 RGB → XYZ (D65)
  let X = (R*0.4124 + G*0.3576 + B*0.1805) / 0.95047;
  let Y = (R*0.2126 + G*0.7152 + B*0.0722) / 1.00000;
  let Z = (R*0.0193 + G*0.1192 + B*0.9505) / 1.08883;
  const f = t => t>0.008856 ? Math.cbrt(t) : (7.787*t + 16/116);
  X=f(X); Y=f(Y); Z=f(Z);
  return [116*Y-16, 500*(X-Y), 200*(Y-Z)];
}
// 预计算每个豆子颜色的 LAB，避免转换时重复计算
PALETTE.forEach(c=>{
  const rgb = hexToRgb(c.h);
  c.rgb = rgb;
  c.lab = rgbToLab(rgb[0],rgb[1],rgb[2]);
});

function nearestBead(r,g,b,pool){
  const lab = rgbToLab(r,g,b);
  let best=0, bestD=Infinity;
  for(let i=0;i<pool.length;i++){
    const L=pool[i].lab;
    const d = (lab[0]-L[0])**2 + (lab[1]-L[1])**2 + (lab[2]-L[2])**2;
    if(d<bestD){bestD=d; best=i;}
  }
  return pool[best];
}

/* ---------- 状态 ---------- */
const state = {
  size: 58,
  grid: [],              // 每格存 PALETTE 索引，null = 空
  color: 0,
  tool: 'pen',
  cell: 16,
  showGrid: true,
  beadStyle: true,       // true=圆豆子外观, false=方块像素
  history: [],
  sourceImage: null,
};

function blankGrid(n){
  return Array.from({length:n}, ()=>Array(n).fill(null));
}
state.grid = blankGrid(state.size);
state.cell = 9;

/* ---------- 渲染 ---------- */
const board = document.getElementById('board');
const ctx = board.getContext('2d');

function render(){
  const n = state.size, c = state.cell;
  board.width = n*c;
  board.height = n*c;

  ctx.fillStyle = '#0C0E13';
  ctx.fillRect(0,0,board.width,board.height);

  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const idx = state.grid[y][x];
      const px = x*c, py = y*c;

      if(idx === null){
        // 空格：画一个小钉子，让空板看起来像真的拼板
        if(state.showGrid){
          ctx.fillStyle = 'rgba(255,255,255,0.055)';
          ctx.beginPath();
          ctx.arc(px+c/2, py+c/2, Math.max(c*0.10,1), 0, Math.PI*2);
          ctx.fill();
        }
        continue;
      }

      ctx.fillStyle = PALETTE[idx].h;
      if(state.beadStyle && c >= 7){
        // 圆环形状 = 拼豆本体
        ctx.beginPath();
        ctx.arc(px+c/2, py+c/2, c*0.46, 0, Math.PI*2);
        ctx.fill();
        // 中间的孔
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(px+c/2, py+c/2, c*0.17, 0, Math.PI*2);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
      }else{
        ctx.fillRect(px, py, c, c);
      }
    }
  }

  // 每 5 格一条参考线，方便照着数格子
  if(state.showGrid && c >= 9){
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1;
    for(let i=0;i<=n;i+=5){
      ctx.beginPath(); ctx.moveTo(i*c+0.5,0); ctx.lineTo(i*c+0.5,n*c); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*c+0.5); ctx.lineTo(n*c,i*c+0.5); ctx.stroke();
    }
  }
  updateStats();
}

/* ---------- 历史（撤销） ---------- */
function pushHistory(){
  state.history.push(state.grid.map(r=>r.slice()));
  if(state.history.length > 40) state.history.shift();  // 限制内存占用
}
function undo(){
  if(!state.history.length){ toast(t('toast_noundo')); return; }
  state.grid = state.history.pop();
  render();
}

/* ---------- 绘制交互 ---------- */
let drawing = false, eraseMode = false, strokeStarted = false;

function cellFromEvent(e){
  const rect = board.getBoundingClientRect();
  const scaleX = board.width / rect.width;
  const scaleY = board.height / rect.height;
  const x = Math.floor((e.clientX - rect.left) * scaleX / state.cell);
  const y = Math.floor((e.clientY - rect.top) * scaleY / state.cell);
  if(x<0||y<0||x>=state.size||y>=state.size) return null;
  return {x,y};
}

function applyTool(pos, forceErase){
  const {x,y} = pos;
  const tool = forceErase ? 'eraser' : state.tool;

  if(tool === 'picker'){
    const idx = state.grid[y][x];
    if(idx !== null){ setColor(idx); toast(t('toast_pick', PALETTE[idx].n)); }
    return;
  }
  if(tool === 'fill'){
    if(!strokeStarted){ pushHistory(); strokeStarted = true; }
    floodFill(x,y, state.grid[y][x], state.color);
    render();
    return;
  }
  const value = (tool === 'eraser') ? null : state.color;
  if(state.grid[y][x] === value) return;   // 没变化就不记历史，避免撤销栈被无效步骤塞满
  if(!strokeStarted){ pushHistory(); strokeStarted = true; }
  state.grid[y][x] = value;
  render();
}

function floodFill(sx, sy, target, replacement){
  if(target === replacement) return;
  const stack = [[sx,sy]], n = state.size;
  while(stack.length){
    const [x,y] = stack.pop();
    if(x<0||y<0||x>=n||y>=n) continue;
    if(state.grid[y][x] !== target) continue;
    state.grid[y][x] = replacement;
    stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
  }
}

board.addEventListener('mousedown', e=>{
  e.preventDefault();
  drawing = true; strokeStarted = false;
  eraseMode = (e.button === 2);
  const pos = cellFromEvent(e);
  if(pos) applyTool(pos, eraseMode);
});
board.addEventListener('mousemove', e=>{
  if(!drawing) return;
  if(state.tool === 'fill' || state.tool === 'picker') return;  // 这两个不支持拖动连续应用
  const pos = cellFromEvent(e);
  if(pos) applyTool(pos, eraseMode);
});
window.addEventListener('mouseup', ()=>{ drawing=false; strokeStarted=false; });
board.addEventListener('contextmenu', e=>e.preventDefault());

// 触屏支持
board.addEventListener('touchstart', e=>{
  e.preventDefault();
  strokeStarted = false;
  const t = e.touches[0];
  const pos = cellFromEvent({clientX:t.clientX, clientY:t.clientY});
  if(pos) applyTool(pos, false);
}, {passive:false});
board.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(state.tool === 'fill' || state.tool === 'picker') return;
  const t = e.touches[0];
  const pos = cellFromEvent({clientX:t.clientX, clientY:t.clientY});
  if(pos) applyTool(pos, false);
}, {passive:false});
board.addEventListener('touchend', ()=>{ strokeStarted = false; });

/* ---------- 统计 / 购物清单 ---------- */
function computeCounts(){
  const counts = new Map();
  for(const row of state.grid){
    for(const idx of row){
      if(idx === null) continue;
      counts.set(idx, (counts.get(idx)||0)+1);
    }
  }
  return [...counts.entries()].sort((a,b)=>b[1]-a[1]);
}

function updateStats(){
  const counts = computeCounts();
  const total = counts.reduce((s,[,q])=>s+q, 0);
  const cells = state.size*state.size;
  // 一块标准拼板 29×29；算需要几块（按面积向上取整）
  const boards = Math.ceil(state.size/29) ** 2;

  document.getElementById('statTotal').textContent = total.toLocaleString();
  document.getElementById('statColors').textContent = counts.length;
  document.getElementById('statBoards').textContent = boards;
  document.getElementById('statFill').textContent = Math.round(total/cells*100) + '%';

  const wrap = document.getElementById('countsWrap');
  if(!counts.length){
    wrap.innerHTML = '<p class="empty-note">' + t('empty_board') + '</p>';
    return;
  }
  wrap.innerHTML = `
    <table class="counts">
      <thead><tr><th>${t('th_color')}</th><th style="text-align:right;">${t('th_qty')}</th></tr></thead>
      <tbody>
        ${counts.map(([i,q])=>`
          <tr>
            <td><span class="mini-chip" style="background:${PALETTE[i].h}"></span>${PALETTE[i].n}</td>
            <td class="qty">${q}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

  if(!counts.length){ toast(t('toast_empty_buy')); return; }
  const total = counts.reduce((s,[,q])=>s+q,0);
  const lines = [
    t('list_title', total, counts.length),
    t('list_size', state.size),
    '',
    ...counts.map(([i,q])=>{
      const packs = Math.ceil(q/1000);
      return t('list_item', PALETTE[i].n, q, packs);
    }),
    '',
    t('list_note'),
  ];
  const text = lines.join('\n');
  navigator.clipboard?.writeText(text)
    .then(()=>toast(t('toast_copied')))
    .catch(()=>{
      // 剪贴板 API 在某些环境（非 https / 权限拒绝）不可用，退回手动复制
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast(t('toast_copied')); }
      catch(_){ toast(t('toast_copyfail')); }
      document.body.removeChild(ta);
    });
});

function convertImage(){
  const n = state.size;
  const img = state.sourceImage;

  // 先把原图按比例缩到 n×n（浏览器缩放会做像素平均，相当于自带抗锯齿）
  const tmp = document.createElement('canvas');
  tmp.width = n; tmp.height = n;
  const tctx = tmp.getContext('2d', {willReadFrequently:true});
  tctx.imageSmoothingEnabled = true;
  tctx.imageSmoothingQuality = 'high';

  // 保持宽高比，居中裁切，避免图片被拉变形
  const side = Math.min(img.width, img.height);
  const sx = (img.width - side)/2;
  const sy = (img.height - side)/2;
  tctx.drawImage(img, sx, sy, side, side, 0, 0, n, n);

  const data = tctx.getImageData(0,0,n,n);
  const px = data.data;

  // 限制可用色数：按原图里各颜色出现频率取最常用的几种
  const limit = Number(document.getElementById('paletteRange').value);
  let pool = PALETTE;
  if(limit < PALETTE.length){
    const freq = new Map();
    for(let i=0;i<px.length;i+=4){
      if(px[i+3] < 128) continue;
      const bead = nearestBead(px[i],px[i+1],px[i+2], PALETTE);
      freq.set(bead, (freq.get(bead)||0)+1);
    }
    pool = [...freq.entries()].sort((a,b)=>b[1]-a[1]).slice(0,limit).map(e=>e[0]);
    if(!pool.length) pool = PALETTE;
  }

  const strength = Number(document.getElementById('ditherRange').value)/100;
  const removeBg = document.getElementById('removeBg').checked;

  pushHistory();
  const grid = blankGrid(n);

  for(let y=0;y<n;y++){
    for(let x=0;x<n;x++){
      const i = (y*n+x)*4;
      const a = px[i+3];

      // 透明 或（可选）接近纯白 → 留空
      if(a < 128){ continue; }
      if(removeBg && px[i]>242 && px[i+1]>242 && px[i+2]>242){ continue; }

      const r = clamp8(px[i]), g = clamp8(px[i+1]), b = clamp8(px[i+2]);
      const bead = nearestBead(r,g,b,pool);
      grid[y][x] = PALETTE.indexOf(bead);

      if(strength > 0){
        // Floyd–Steinberg 抖动：把这一格的色差按固定权重"推"给右/下方还没处理的像素，
        // 让相邻豆子的混色在视觉上逼近原色。strength 用来控制推多少。
        const er = (r - bead.rgb[0]) * strength;
        const eg = (g - bead.rgb[1]) * strength;
        const eb = (b - bead.rgb[2]) * strength;
        spread(px, n, x+1, y,   er,eg,eb, 7/16);
        spread(px, n, x-1, y+1, er,eg,eb, 3/16);
        spread(px, n, x,   y+1, er,eg,eb, 5/16);
        spread(px, n, x+1, y+1, er,eg,eb, 1/16);
      }
    }
  }

  state.grid = grid;
  render();
  switchTab('stats');
  toast(t('toast_converted', computeCounts().length));
}

function clamp8(v){ return v<0?0:v>255?255:v; }
function spread(px,n,x,y,er,eg,eb,w){
  if(x<0||y<0||x>=n||y>=n) return;
  const i=(y*n+x)*4;
  px[i]   = clamp8(px[i]   + er*w);
  px[i+1] = clamp8(px[i+1] + eg*w);
  px[i+2] = clamp8(px[i+2] + eb*w);
}

/* ---------- 保存 / 打开 / 导出 ---------- */
document.getElementById('saveBtn').addEventListener('click', ()=>{
  const payload = {
    format:'cyber-perler-v1',
    size: state.size,
    // 存色名而不是索引：以后调色板增删颜色，老文件依然能正确打开
    grid: state.grid.map(row=>row.map(i=> i===null ? null : PALETTE[i].n)),
    savedAt: new Date().toISOString(),
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  downloadBlob(blob, `perler-${state.size}x${state.size}-${Date.now()}.json`);
  toast(t('toast_saved'));
});

document.getElementById('loadBtn').addEventListener('click', ()=>{
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(data.format !== 'cyber-perler-v1') throw new Error(t('err_notours'));
        if(!Array.isArray(data.grid) || !data.size) throw new Error(t('err_incomplete'));

        const nameToIndex = new Map(PALETTE.map((c,i)=>[c.n,i]));
        pushHistory();
        state.size = data.size;
        document.getElementById('sizeSelect').value = String(data.size);
        state.grid = data.grid.map(row=>row.map(name=>{
          if(name === null) return null;
          const idx = nameToIndex.get(name);
          return idx === undefined ? null : idx;   // 认不出的颜色留空，而不是整个文件打不开
        }));
        render();
        toast(t('toast_opened'));
      }catch(err){
        toast(t('toast_openfail', err.message));
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  // 导出时用更大的格子，保证图纸打印出来清晰
  const scale = Math.max(1, Math.ceil(600 / (state.size * state.cell)));
  const out = document.createElement('canvas');
  out.width = board.width * scale;
  out.height = board.height * scale;
  const octx = out.getContext('2d');
  octx.fillStyle = '#0C0E13';
  octx.fillRect(0,0,out.width,out.height);
  octx.imageSmoothingEnabled = false;
  octx.drawImage(board, 0, 0, out.width, out.height);
  out.toBlob(blob=>{
    downloadBlob(blob, `perler-pattern-${state.size}x${state.size}.png`);
    toast(t('toast_exported'));
  });
});

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- 其他控件 ---------- */
document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(computeCounts().length && !confirm(t('confirm_clear'))) return;
  pushHistory();
  state.grid = blankGrid(state.size);
  render();
});

document.getElementById('sizeSelect').addEventListener('change', e=>{
  const n = Number(e.target.value);
  if(computeCounts().length && !confirm(t('confirm_resize'))){
    e.target.value = String(state.size);
    return;
  }
  state.size = n;
  state.grid = blankGrid(n);
  state.cell = n<=20 ? 22 : n<=29 ? 16 : n<=40 ? 12 : n<=58 ? 9 : 6;
  render();
  if(state.sourceImage){
    document.getElementById('convertHint').textContent =
      t('loaded_short', n);
  }
});

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('gridToggleBtn').addEventListener('click', ()=>{
  state.showGrid = !state.showGrid; render();
});
document.getElementById('styleToggleBtn').addEventListener('click', e=>{
  state.beadStyle = !state.beadStyle;
  e.target.textContent = state.beadStyle ? t('style_bead') : t('style_px');
  render();
});
document.getElementById('zoomIn').addEventListener('click', ()=>{
  state.cell = Math.min(state.cell+3, 34); render();
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  state.cell = Math.max(state.cell-3, 4); render();
});

document.querySelectorAll('.tool[data-tool]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tool = btn.dataset.tool;
    document.getElementById('stageHint').textContent = t('hint_stage')[state.tool];
  });
});

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  ['palette','import','stats'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = (t===name) ? 'block' : 'none';
  });
}
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>switchTab(tab.dataset.tab));
});

/* 快捷键 */
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,select,textarea')) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  const map = {b:'pen', e:'eraser', g:'fill', i:'picker'};
  const tool = map[e.key.toLowerCase()];
  if(tool){
    document.querySelector(`.tool[data-tool="${tool}"]`).click();
  }
});

/* Toast */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------- 启动 ---------- */
buildPalette();
applyLang();
render();

document.getElementById('langBtn').addEventListener('click', ()=>{
  LANG = (LANG === 'zh') ? 'en' : 'zh';
  applyLang();
});
</script>
</body>
</html>
